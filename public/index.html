<!DOCTYPE html>
<html lang="en">
<head>
  <title>AR Chair Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- Permissions so WebXR can run in an <iframe> -->
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, xr-spatial-tracking=*">

  <style>
    body{font-family:Arial,sans-serif;text-align:center;}
    #ar-model{width:100%;height:600px;background:#f0f0f0;}
    #launchBtn{
          margin-top: 1.5rem;
          padding: 16px 32px;
          font-size: 1.125rem;
          width: 200px;                  /* fixed width */
          height: 60px;                  /* fixed height */
          font-weight: 600;
          border: none;
          border-radius: 6px;       /* rounded-[2px] */
          background: #364F6B;      /* replace with your primary-blue hex */
          color: #ffffff;
          transition: background 0.2s ease;
        }

  #launchBtn:hover{
    background: #1f2937;      /* gray-800 equivalent */
    cursor: pointer;
  }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      left: -99999px !important;
      top: -99999px !important;
      overflow: hidden !important;
    }


  </style>
</head>
<body>

<model-viewer id="ar-model" class="visually-hidden"
  src="3Dimage5_savanna.glb"
  alt="3D model of an office chair"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto"
  ar-placement="floor"
  scale="1 1 1"
  camera-controls
  shadow-intensity="1"
  auto-rotate>
</model-viewer>

<button id="launchBtn">View in AR</button>

<script>
  const viewer = document.getElementById('ar-model');
  const btn    = document.getElementById('launchBtn');

  // --- NEW: swap model via ?model=slug ---
  (function setModelFromQuery(){
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('model') || '3Dimage1_atlas';
    // Basic sanitize: allow letters, numbers, underscore, dash, dot
    const safeSlug = slug.replace(/[^a-z0-9_\-\.]/gi,'');
    viewer.setAttribute('src', `${safeSlug}.glb`);
  })();


  // Hide the 3D canvas ONLY when embedded in an iframe
  //(function hideModelIfFramed(){
   // if (window.top !== window.self) {
    //  viewer.classList.add('hidden-when-framed');
    //}
  //})();

  // Launch AR (WebXR requires a gesture)
  btn.addEventListener('click', () => viewer.activateAR());

  // Hide button once AR begins
  viewer.addEventListener('ar-status', (e) => {
    btn.disabled = e.detail.status === 'session-started';
  });

  // Fallback to Scene Viewer if WebXR unsupported
  //viewer.addEventListener('load', () => {
   // if (!navigator.xr) viewer.activateAR();
  //});
</script>

</body>
</html>
