<!DOCTYPE html>
<html lang="en">
<head>
  <title>AR Chair Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- IMPORTANT:
       Your old Permissions-Policy meta was blocking camera/xr completely.
       Remove it or relax it. For a top-level page, you can omit it entirely. -->
  <!--
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), xr-spatial-tracking=*">
  -->

  <style>
    body{font-family:Arial,sans-serif;text-align:center;margin:0;padding:2rem;}
    #ar-model{width:100%;height:600px;background:#f0f0f0;}
    #launchBtn{
      margin-top:2rem;
      padding:12px 24px;
      font-size:1rem;
      font-weight:600;
      border:none;
      border-radius:4px;
      background:#0d6efd;
      color:#fff;
    }
    #launchBtn:hover:enabled{background:#0947b0;cursor:pointer;}

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      left: -99999px !important;
      top: -99999px !important;
      overflow: hidden !important;
    }

    #ar-status-msg {
      margin-top:1rem;
      font-size:0.9rem;
      color:#555;
    }
  </style>
</head>
<body>

<model-viewer id="ar-model" class="visually-hidden"
  src="3Dimage5_savanna.glb"
  alt="3D model of an office chair"
  ar
  ar-modes="webxr"
  ar-scale="auto"
  ar-placement="floor"
  scale="1 1 1"
  camera-controls
  shadow-intensity="1"
  auto-rotate>
</model-viewer>

<button id="launchBtn" disabled>Checking AR support…</button>
<div id="ar-status-msg"></div>

<script>
  const viewer = document.getElementById('ar-model');
  const btn    = document.getElementById('launchBtn');
  const status = document.getElementById('ar-status-msg');

  // --- model via ?model=slug ---
  (function setModelFromQuery(){
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('model') || '3Dimage1_atlas';
    const safeSlug = slug.replace(/[^a-z0-9_\-\.]/gi,'');
    viewer.setAttribute('src', `${safeSlug}.glb`);
  })();

  // --- WebXR feature detection + configuration ---
  async function initWebXR() {
    // Default UI message while checking
    btn.disabled = true;
    btn.textContent = 'Checking AR support…';
    status.textContent = '';

    // 1) Is the WebXR API even present?
    if (!('xr' in navigator)) {
      // No WebXR at all → don't try AR, don't fall back
      disableAR('This browser does not support WebXR AR. Try an ARCore-capable Android device with Chrome.');
      return;
    }

    let immersiveArSupported = false;
    try {
      immersiveArSupported = await navigator.xr.isSessionSupported('immersive-ar');
    } catch (err) {
      console.error('Error while checking WebXR support:', err);
    }

    if (!immersiveArSupported) {
      // WebXR exists but AR sessions are not supported on this device
      disableAR('WebXR is available, but immersive AR is not supported on this device.');
      return;
    }

    // 2) WebXR immersive AR is supported → configure <model-viewer> to use ONLY WebXR
    viewer.setAttribute('ar', '');
    viewer.setAttribute('ar-modes', 'webxr');

    btn.disabled = false;
    btn.textContent = 'View in AR';
    status.textContent = 'WebXR AR is supported on this device.';
  }

  function disableAR(message) {
    // Turn off AR on the viewer completely
    viewer.removeAttribute('ar');
    viewer.removeAttribute('ar-modes');

    btn.disabled = true;
    btn.textContent = 'AR not available';
    status.textContent = message;
  }

  // Initialize WebXR logic on load
  initWebXR();

  // Launch AR (WebXR requires a user gesture)
  btn.addEventListener('click', () => {
    if (!btn.disabled) {
      viewer.activateAR();
    }
  });

  // Optional: update UI once AR session starts
  viewer.addEventListener('ar-status', (e) => {
    if (e.detail.status === 'session-started') {
      btn.disabled = true;
      btn.textContent = 'AR session running…';
    } else if (e.detail.status === 'not-presenting') {
      // When AR session ends, re-enable the button
      btn.disabled = false;
      btn.textContent = 'View in AR';
    }
  });
</script>

</body>
</html>
