<!DOCTYPE html>
<html lang="en">
<head>
    <title>Simple AR Chair Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 600px;
            background-color: #f0f0f0;
            display: none; /* Hide the 3D model viewer */
        }
    </style>
</head>
<body>

<h1>Launching AR Mode...</h1>

<!-- 3D Model Viewer (hidden) -->
<model-viewer id="ar-model"
    src=""
    alt="3D model of an office chair"
    ar
    ar-modes="scene-viewer quick-look"
    camera-controls
    auto-rotate>
</model-viewer>

<script>
    // Parse model name from URL (?model=...) or fallback
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('model') || 'office_chair';
    const modelViewer = document.getElementById('ar-model');
    // Set the model src
    modelViewer.setAttribute('src', `/models/${slug}.glb`);
    // When the model is loaded, trigger AR mode
    modelViewer.addEventListener('load', () => {
        modelViewer.activateAR();
    });
    // For some browsers, model-viewer fires 'poster-dismissed' or 'ar-status' instead of 'load'
    modelViewer.addEventListener('poster-dismissed', () => {
        modelViewer.activateAR();
    });
    // Fallback: try to trigger AR after a short delay
    setTimeout(() => {
        modelViewer.activateAR();
    }, 1500);
</script>

</body>
</html>
