<!DOCTYPE html>
<html lang="en">
<head>
  <title>AR Test – Single GLB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- model-viewer -->
  <script type="module"
          src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <!-- Permissions so WebXR can run in an <iframe> if you embed this -->
  <meta http-equiv="Permissions-Policy"
        content="camera=(), microphone=(), xr-spatial-tracking=*">

  <style>
    body            { font-family: Arial, sans-serif; text-align: center; }
    #ar-model        { width: 100%; height: 600px; background:#f0f0f0; }
    #launchBtn       { margin-top: 2rem; padding: 12px 24px; font-size: 1rem;
                       font-weight: 600; border: none; border-radius: 4px;
                       background:#0d6efd; color:#fff; }
    #launchBtn:hover { background:#0947b0; cursor:pointer; }
  </style>
</head>
<body>


<!-- 3D / AR component -->
<model-viewer id="ar-model"
    src="3Dimage5_savanna.glb"                       
    alt="3D model of an office chair"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    ar-placement="floor"
    camera-controls
    shadow-intensity="1"
    auto-rotate>
</model-viewer>

<button id="launchBtn">View in AR</button>

<script>
  const viewer = document.getElementById('ar-model');
  const btn    = document.getElementById('launchBtn');

  // WebXR requires a user gesture
  btn.addEventListener('click', () => viewer.activateAR());

  // Hide button once AR begins
  viewer.addEventListener('ar-status', (e) => {
    if (e.detail.status === 'session-started') btn.style.display = 'none';
  });

  // Fallback to Scene Viewer if WebXR unsupported
  viewer.addEventListener('load', () => {
    if (!navigator.xr) viewer.activateAR();
  });
</script>

</body>
</html>
